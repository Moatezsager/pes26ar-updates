name: Probe cloud mirror runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check cloud access with a tiny request
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://gitlab.com/api/v4/projects/89205177/packages/generic/pes26ar-data/2026.11.20.1/5dbda4ec2ad39dc098fbfd58ef88a79fce72c93bca16340ee97a5d2c6ade877e.bin'
          request=urllib.request.Request(url,headers={'Range':'bytes=0-1023'})
          with urllib.request.urlopen(request,timeout=30) as response:
              assert response.status==206 and len(response.read(1025))==1024
          print('CLOUD_RUNNER_AND_GITLAB_SOURCE_OK; sampled_bytes=1024')
          PY
